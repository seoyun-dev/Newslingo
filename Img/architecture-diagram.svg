<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2150" viewBox="0 0 1600 2150">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#718096" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383c4"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #16324f; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #61758b; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1f2937; text-anchor: middle; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #526579; text-anchor: middle; }
      .edge { font: 600 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #2383c4; text-anchor: middle; }
      .core-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #2f5f8f; text-anchor: middle; }
      .core-text { font: 500 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4d6a86; text-anchor: middle; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .user { fill: #ffffff; stroke: #78aeda; }
      .ai { fill: #f7f0ff; stroke: #a985d6; }
      .tool { fill: #eaf8f1; stroke: #5cb88a; }
      .decision { fill: #fff9df; stroke: #e6b94f; }
      .memory { fill: #fff0f1; stroke: #dd8990; }
      .hitl { fill: #ffe9d6; stroke: #dd8a3d; }
      .core { fill: #eaf2fc; stroke: #88afd2; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #2383c4; stroke-width: 2.5; marker-end: url(#blueArrow); }
      .dashed { fill: none; stroke: #7890a8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .pill { fill: #eef3fb; }
      .legend-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #16324f; text-anchor: middle; }
      .legend-label { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1f2937; }
      .legend-desc { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #6b7889; }
    </style>
  </defs>

  <rect x="16" y="16" width="1568" height="2118" rx="24" fill="url(#background)" stroke="#277bb4" stroke-width="4"/>
  <text x="800" y="68" class="title" text-anchor="middle">📰 NEWSLINGO AI AGENT</text>
  <text x="800" y="100" class="subtitle" text-anchor="middle">뉴스 기사 기반 개인화 영어 학습 서비스 구조도 (Streamlit UI 기준)</text>

  <!-- ============ onboarding ============ -->
  <rect x="490" y="140" width="380" height="76" rx="14" class="box user"/>
  <text x="680" y="174" class="label">👤 사용자 접속</text>
  <text x="680" y="199" class="small">학습 세션 시작</text>

  <path d="M680 216 V254" class="line"/>
  <rect x="470" y="254" width="420" height="82" rx="14" class="box user"/>
  <text x="680" y="290" class="label">🎚️ 초기 난이도 선택</text>
  <text x="680" y="316" class="small">초급 · 중급 · 고급</text>

  <path d="M680 336 V374" class="line"/>
  <rect x="445" y="374" width="470" height="82" rx="14" class="box memory"/>
  <text x="680" y="410" class="label">💾 프로필 저장</text>
  <text x="680" y="436" class="small">Store · topic · level</text>

  <path d="M680 456 V494" class="line"/>
  <rect x="420" y="494" width="520" height="84" rx="14" class="box user"/>
  <text x="680" y="530" class="label">✏️ 학습 주제 입력</text>
  <text x="680" y="556" class="small">예: 인공지능 Transformer 관련 뉴스</text>

  <!-- ============ guardrails ============ -->
  <path d="M680 578 V616" class="line"/>
  <rect x="410" y="616" width="540" height="352" rx="20" class="core"/>
  <text x="680" y="656" class="edge" font-size="18" text-anchor="middle">🛡️ 2단계 Guardrail</text>
  <text x="680" y="682" class="small" font-size="14" text-anchor="middle">부적절한 요청은 기사 검색 전에 차단</text>

  <rect x="440" y="716" width="480" height="82" rx="14" class="box decision"/>
  <text x="680" y="752" class="label">🔍 1차 규칙 기반 필터</text>
  <text x="680" y="778" class="small">금칙어 · 위험 요청 검사</text>

  <path d="M680 798 V836" class="line"/>
  <rect x="740" y="810" width="46" height="20" rx="6" class="pill"/>
  <text x="763" y="825" class="edge" text-anchor="middle">허용</text>

  <rect x="440" y="836" width="480" height="82" rx="14" class="box decision"/>
  <text x="680" y="872" class="label">🤖 2차 분류 모델</text>
  <text x="680" y="898" class="small">TopicGuardrailResult · 오프토픽 판별</text>

  <path d="M680 918 V1006" class="line"/>
  <rect x="740" y="974" width="46" height="20" rx="6" class="pill"/>
  <text x="763" y="989" class="edge" text-anchor="middle">허용</text>

  <!-- reject branch: both stages exit left into the block box -->
  <path d="M440 757 H375 V805 H300" class="blueLine"/>
  <path d="M440 877 H375 V829 H300" class="blueLine"/>
  <rect x="349" y="740" width="42" height="20" rx="6" class="pill"/>
  <text x="370" y="755" class="edge" text-anchor="middle">차단</text>

  <rect x="110" y="772" width="190" height="90" rx="12" class="box memory"/>
  <text x="205" y="806" class="label" font-size="18">⛔ 차단 안내</text>
  <text x="205" y="832" class="small" font-size="13">주제 다시 입력</text>

  <path d="M205 772 V536 H420" class="dashed"/>
  <rect x="130" y="648" width="82" height="22" rx="6" class="pill"/>
  <text x="171" y="664" class="edge" text-anchor="middle">🔁 재입력</text>

  <!-- ============ search and study ============ -->
  <rect x="400" y="1006" width="560" height="88" rx="14" class="box tool"/>
  <text x="680" y="1044" class="label">🔎 news_search Tool</text>
  <text x="680" y="1070" class="small">Guardian Open Platform에서 영문 뉴스 검색 (bodyText 전문)</text>

  <path d="M680 1094 V1132" class="line"/>
  <rect x="395" y="1132" width="570" height="86" rx="14" class="box ai"/>
  <text x="680" y="1168" class="label">📰 기사 후보 5개 추천</text>
  <text x="680" y="1194" class="small">ArticleCandidateList · Structured Output</text>

  <path d="M680 1218 V1256" class="line"/>
  <rect x="435" y="1256" width="490" height="82" rx="14" class="box user"/>
  <text x="680" y="1292" class="label">👆 사용자 기사 선택</text>
  <text x="680" y="1318" class="small">카드 클릭으로 학습할 기사 결정</text>

  <path d="M680 1338 V1376" class="line"/>
  <rect x="370" y="1376" width="620" height="90" rx="14" class="box ai"/>
  <text x="680" y="1413" class="label">📚 학습자료 생성</text>
  <text x="680" y="1441" class="small">원문 · 번역 · 전문용어 · 기본단어 · 문법 포인트</text>

  <!-- ============ chat ============ -->
  <path d="M680 1466 V1504" class="line"/>
  <rect x="425" y="1504" width="510" height="86" rx="14" class="box ai"/>
  <text x="680" y="1540" class="label">💬 기사 기반 자유 채팅</text>
  <text x="680" y="1566" class="small">Agent가 기사 원문·학습자료를 근거로 응답</text>

  <!-- "다른 기사" is now a plain UI action (Streamlit card click / CLI 'n'), not routed through the chat Agent -->
  <path d="M425 1547 H350 V1297 H435" class="blueLine"/>
  <rect x="255" y="1558" width="224" height="22" rx="6" class="pill"/>
  <text x="367" y="1574" class="edge" text-anchor="middle">🔘 다른 기사 (UI 버튼)</text>

  <!-- HITL preference-change branch -->
  <rect x="1010" y="1504" width="260" height="110" rx="14" class="box hitl"/>
  <text x="1140" y="1536" class="label" font-size="18">🙋 선호 변경</text>
  <text x="1140" y="1562" class="small" font-size="13">HITL 승인 필요</text>
  <text x="1140" y="1584" class="small" font-size="13">승인 시 Store 갱신</text>
  <path d="M935 1547 H1010" class="blueLine"/>
  <path d="M1140 1614 V1670 H945" class="blueLine"/>

  <!-- ============ quiz ============ -->
  <path d="M680 1590 V1628" class="line"/>
  <rect x="415" y="1628" width="530" height="84" rx="14" class="box user"/>
  <text x="680" y="1664" class="label">🏁 퀴즈 응시하기 (버튼)</text>
  <text x="680" y="1690" class="small">언제든 클릭 가능 — 채팅과 독립적</text>

  <path d="M680 1712 V1750" class="line"/>
  <rect x="365" y="1750" width="630" height="88" rx="14" class="box ai"/>
  <text x="680" y="1786" class="label">📝 퀴즈 5문항 생성(영어) · 자동 채점</text>
  <text x="680" y="1812" class="small">기사 내용 + 채팅 로그 · 정답률 계산</text>

  <!-- ============ Checkpointer panel (left, mirrors Agent Core) ============ -->
  <rect x="80" y="1006" width="260" height="470" rx="18" class="box core"/>
  <text x="210" y="1191" class="core-title">🗂️ Checkpointer</text>
  <text x="210" y="1225" class="core-text">대화 이력 유지</text>
  <text x="210" y="1259" class="core-text">프로필 저장 ~ 퀴즈 채점까지</text>
  <text x="210" y="1293" class="core-text">세션 상태 지속</text>

  <!-- ============ Agent Core panel (right, mirrors Checkpointer) ============ -->
  <rect x="1010" y="1006" width="260" height="470" rx="18" class="box core"/>
  <text x="1140" y="1130" class="core-title">🧠 Agent Core</text>
  <text x="1140" y="1172" class="core-text">LLM · gpt-4o (폴백 4o-mini)</text>
  <text x="1140" y="1204" class="core-text">⚙️ Middleware</text>
  <text x="1140" y="1234" class="core-text">프로필+기사 컨텍스트 주입</text>
  <text x="1140" y="1264" class="core-text">요약 · 폴백</text>
  <text x="1140" y="1294" class="core-text">Tool: update_preference</text>
  <text x="1140" y="1332" class="small" font-size="13">(퀴즈/추천/학습자료 생성은</text>
  <text x="1140" y="1354" class="small" font-size="13">별도 LCEL 체인이 전담)</text>

  <!-- ============ legend ============ -->
  <rect x="85" y="1878" width="1430" height="1" fill="#c6d5e4"/>
  <text x="800" y="1912" class="legend-title">🎨 박스 색상 범례 · 무엇을 기준으로 나눴나</text>

  <!-- row 0 -->
  <rect x="100" y="1938" width="20" height="20" rx="5" class="box user"/>
  <text x="130" y="1953" class="legend-label">사용자 액션</text>
  <text x="130" y="1972" class="legend-desc">사람이 직접 입력·선택·버튼 클릭하는 단계</text>

  <rect x="480" y="1938" width="20" height="20" rx="5" class="box memory"/>
  <text x="510" y="1953" class="legend-label">상태 저장 · 안내</text>
  <text x="510" y="1972" class="legend-desc">Store 기록, LLM 호출 없는 시스템 메시지</text>

  <rect x="860" y="1938" width="20" height="20" rx="5" class="box decision"/>
  <text x="890" y="1953" class="legend-label">가드레일 판단</text>
  <text x="890" y="1972" class="legend-desc">규칙·분류 기반 통과/차단 자동 판정</text>

  <rect x="1240" y="1938" width="20" height="20" rx="5" class="box tool"/>
  <text x="1270" y="1953" class="legend-label">Tool 호출</text>
  <text x="1270" y="1972" class="legend-desc">외부 API를 실행하는 단계</text>

  <!-- row 1 -->
  <rect x="100" y="2000" width="20" height="20" rx="5" class="box ai"/>
  <text x="130" y="2015" class="legend-label">Agent(LLM) 생성</text>
  <text x="130" y="2034" class="legend-desc">Agent Core / LCEL 체인이 콘텐츠를 생성</text>

  <rect x="480" y="2000" width="20" height="20" rx="5" class="box hitl"/>
  <text x="510" y="2015" class="legend-label">HITL 승인</text>
  <text x="510" y="2034" class="legend-desc">사람의 승인이 있어야 진행되는 지점</text>

  <rect x="860" y="2000" width="20" height="20" rx="5" class="box core"/>
  <text x="890" y="2015" class="legend-label">구조 설명 패널</text>
  <text x="890" y="2034" class="legend-desc">실제 실행 단계가 아닌 구조 설명용 박스</text>

  <rect x="85" y="2076" width="1430" height="1" fill="#c6d5e4"/>
  <text x="800" y="2108" class="subtitle" text-anchor="middle">Newslingo · Guardrail · Agent · Structured Output · Memory · HITL</text>
</svg>
