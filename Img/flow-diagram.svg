<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1560" viewBox="0 0 1400 1560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#718096" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2383c4"/>
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #16324f; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #61758b; }
      .step { font: 700 15px ui-monospace, "SF Mono", monospace; fill: #2383c4; text-anchor: middle; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #1f2937; text-anchor: middle; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #526579; text-anchor: middle; }
      .edge { font: 600 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #2383c4; text-anchor: middle; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .user { fill: #ffffff; stroke: #78aeda; }
      .ai { fill: #f7f0ff; stroke: #a985d6; }
      .tool { fill: #eaf8f1; stroke: #5cb88a; }
      .decision { fill: #fff9df; stroke: #e6b94f; }
      .memory { fill: #fff0f1; stroke: #dd8990; }
      .hitl { fill: #ffe9d6; stroke: #dd8a3d; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .blueLine { fill: none; stroke: #2383c4; stroke-width: 2.5; marker-end: url(#blueArrow); }
      .dashed { fill: none; stroke: #7890a8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .pill { fill: #eef3fb; }
      .stepBadge { fill: #eaf2fc; stroke: #88afd2; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="14" y="14" width="1372" height="1532" rx="24" fill="url(#bg)" stroke="#277bb4" stroke-width="4"/>
  <text x="700" y="62" class="title" text-anchor="middle">NEWSLINGO 동작 흐름 (2.2 Flow)</text>
  <text x="700" y="90" class="subtitle" text-anchor="middle">사용자 입력 → 0~15단계 → 최종 응답 / 프로필</text>

  <!-- 0단계 -->
  <rect x="30" y="130" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="150" class="step">0단계</text>
  <rect x="450" y="130" width="500" height="80" rx="14" class="box user"/>
  <text x="700" y="164" class="label">👤 사용자 접속 → 난이도 선택</text>
  <text x="700" y="190" class="small">Store에 topic/level 저장</text>

  <path d="M700 210 V244" class="line"/>

  <!-- 1~2단계 -->
  <rect x="30" y="250" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="270" class="step">1~2단계</text>
  <rect x="380" y="256" width="640" height="230" rx="20" class="box" fill="#eaf2fc" stroke="#88afd2" stroke-dasharray="8 6"/>
  <text x="700" y="292" class="edge" font-size="16">🛡️ 입력 가드레일 (2단계)</text>

  <rect x="420" y="310" width="560" height="70" rx="12" class="box decision"/>
  <text x="700" y="340" class="label" font-size="18">1차 규칙 기반 필터</text>
  <text x="700" y="362" class="small">금칙어 · 위험 요청 → 모델 호출 없이 즉시 차단</text>

  <path d="M700 380 V404" class="line"/>
  <rect x="730" y="386" width="44" height="18" rx="5" class="pill"/>
  <text x="752" y="399" class="edge" font-size="12">허용</text>

  <rect x="420" y="404" width="560" height="70" rx="12" class="box decision"/>
  <text x="700" y="434" class="label" font-size="18">2차 분류 모델</text>
  <text x="700" y="456" class="small">TopicGuardrailResult · 오프토픽 판별</text>

  <!-- reject loop: both stages exit into the 차단 안내 box (arrowheads land on the box) -->
  <path d="M420 345 H240 V398 H210" class="blueLine"/>
  <path d="M420 434 H240 V398 H210" class="blueLine"/>
  <rect x="150" y="360" width="40" height="18" rx="5" class="pill"/>
  <text x="170" y="373" class="edge" font-size="12">차단</text>
  <rect x="60" y="368" width="150" height="60" rx="10" class="box memory"/>
  <text x="135" y="393" class="label" font-size="14">⛔ 차단 안내</text>
  <text x="135" y="412" class="small" font-size="11">재입력</text>
  <path d="M135 368 V190 H450" class="dashed"/>

  <path d="M700 474 V510" class="line"/>
  <rect x="730" y="490" width="44" height="18" rx="5" class="pill"/>
  <text x="752" y="503" class="edge" font-size="12">허용</text>

  <!-- 3~4단계 -->
  <rect x="30" y="516" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="536" class="step">3~4단계</text>
  <rect x="420" y="516" width="560" height="76" rx="14" class="box tool"/>
  <text x="700" y="548" class="label">🔎 news_search Tool → 기사 5개 추천</text>
  <text x="700" y="572" class="small">Guardian API 검색 → article_recommender_chain</text>

  <path d="M700 592 V626" class="line"/>

  <!-- 5~6단계 -->
  <rect x="30" y="632" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="652" class="step">5~6단계</text>
  <rect x="420" y="632" width="560" height="76" rx="14" class="box user"/>
  <text x="700" y="664" class="label">👆 기사 선택 → 학습자료 생성</text>
  <text x="700" y="688" class="small">원문 · 번역 · 전문용어 · 기본단어 · 문법</text>

  <path d="M700 708 V742" class="line"/>

  <!-- 7단계 -->
  <rect x="30" y="748" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="768" class="step">7단계</text>
  <rect x="420" y="748" width="560" height="76" rx="14" class="box ai"/>
  <text x="700" y="780" class="label">💬 자유 채팅 (기사 원문·학습자료 근거)</text>
  <text x="700" y="804" class="small">Tool: update_preference (명시적 요청 시에만)</text>

  <!-- HITL branch to the right -->
  <path d="M980 786 H1090" class="blueLine"/>
  <rect x="1090" y="748" width="230" height="90" rx="14" class="box hitl"/>
  <text x="1205" y="778" class="label" font-size="17">🙋 선호 변경 요청</text>
  <text x="1205" y="800" class="small" font-size="13">HITL 2차 승인</text>
  <text x="1205" y="820" class="small" font-size="13">승인 시 Store 갱신</text>
  <path d="M1205 838 V860 H1000 V824" class="blueLine"/>

  <!-- 다른 기사 loop from chat back to article select -->
  <path d="M420 786 H260 V670 H420" class="blueLine"/>
  <rect x="150" y="756" width="120" height="20" rx="6" class="pill"/>
  <text x="210" y="770" class="edge" font-size="12">🔁 다른 기사</text>

  <path d="M700 824 V858" class="line"/>

  <!-- 8~9단계 -->
  <rect x="30" y="864" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="884" class="step">8~9단계</text>
  <rect x="420" y="864" width="560" height="76" rx="14" class="box ai"/>
  <text x="700" y="896" class="label">📝 퀴즈 5문항 생성 (버튼, 채팅과 독립)</text>
  <text x="700" y="920" class="small">영어 4지선다 · 기사+채팅 로그 근거</text>

  <path d="M700 940 V974" class="line"/>

  <!-- 10~11단계 -->
  <rect x="30" y="980" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="1000" class="step">10~11단계</text>
  <rect x="420" y="980" width="560" height="76" rx="14" class="box memory"/>
  <text x="700" y="1012" class="label">✅ 채점 → 난이도 추천</text>
  <text x="700" y="1036" class="small">순수 로직(LLM 미사용) · 정답률 80%↑/40%↓ 임계치</text>

  <path d="M700 1056 V1090" class="line"/>

  <!-- 12~14단계 -->
  <rect x="30" y="1096" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="1116" class="step">12~14단계</text>
  <rect x="420" y="1096" width="560" height="90" rx="14" class="box user"/>
  <text x="700" y="1128" class="label">🎚️ 난이도 조정 선택</text>
  <text x="700" y="1150" class="small">추천 방향과 무관하게 상향/하향/유지 항상 제시</text>
  <text x="700" y="1172" class="small">다르면 update_preference → HITL 2차 승인</text>

  <path d="M700 1186 V1220" class="line"/>

  <!-- 15단계 -->
  <rect x="30" y="1226" width="90" height="30" rx="8" class="stepBadge"/>
  <text x="75" y="1246" class="step">15단계</text>
  <rect x="420" y="1226" width="560" height="90" rx="14" class="box tool"/>
  <text x="700" y="1258" class="label">🔁 다른 기사 탐색 (선택)</text>
  <text x="700" y="1280" class="small">안 읽은 후보 있으면 재표시, 없으면 재검색</text>
  <text x="700" y="1302" class="small">(→ 5~6단계로 순환)</text>

  <path d="M420 1271 H240 V670 H420" class="dashed"/>
  <rect x="170" y="1261" width="60" height="20" rx="6" class="pill"/>
  <text x="200" y="1275" class="edge" font-size="12">순환</text>

  <path d="M700 1316 V1350" class="line"/>

  <!-- 최종 -->
  <rect x="420" y="1350" width="560" height="76" rx="14" class="box user"/>
  <text x="700" y="1382" class="label">🏁 최종 응답 / 최종 프로필</text>
  <text x="700" y="1406" class="small">학습 종료 선택 시 여기서 흐름 종료</text>

  <rect x="60" y="1460" width="1280" height="1" fill="#c6d5e4"/>
  <text x="700" y="1500" class="subtitle" text-anchor="middle">Newslingo · 설계서 2.2 동작 흐름 (Flow) 전용 다이어그램</text>
</svg>
